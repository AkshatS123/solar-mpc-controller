[project]
name = "solar-mpc-controller"
version = "0.0.1"
description = "Open-source MPC controller for charging an EV from rooftop solar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshat Sharma" }]
dependencies = [
    "click>=8.1",
    "cvxpy>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.scripts]
solar-mpc = "solar_mpc.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_mpc"]
